name: Reference assets

# Dev-time only. Builds the bundled photo packs from reference-packs/manifest.json and
# commits them, or gathers candidate previews for curation. The app itself never
# downloads anything from a third party.
on:
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        default: build-packs
        options:
          - build-packs
          - harvest-candidates
      only:
        description: Limit to these categories (space separated), or leave empty for all
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: reference-assets-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the image tools
        run: npm install --no-save --no-package-lock sharp@0.34

      - name: Gather candidates for curation
        if: inputs.task == 'harvest-candidates'
        run: |
          node scripts/harvest-reference-candidates.mjs ${{ inputs.only }}
          cd candidates
          git init -q -b reference-candidates
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Candidate previews for curation (scratch, safe to delete)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" reference-candidates

      # One category at a time, committed as it finishes, so a slow host or a timeout
      # never throws away the categories that are already done.
      - name: Build and commit the photo packs
        if: inputs.task == 'build-packs'
        env:
          CATEGORIES: ${{ inputs.only || 'face pose hands-feet urban' }}
          # Milliseconds between Wikimedia requests; it rate limits bursts.
          WIKIMEDIA_GAP: '4000'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for category in $CATEGORIES; do
            node scripts/build-reference-packs.mjs "$category"
            git add public/packs CREDITS.md reference-packs/build-report.json
            if git diff --cached --quiet; then
              echo "$category: nothing changed."
              continue
            fi
            git commit -q -m "Build the $category reference photo pack"
            # Other commits may have landed while the pack was building.
            git pull --rebase -q origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          done
